[project]
name = "local-llm-manager"
version = "0.1.0"
description = "Administrador local de modelos para llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
local-llm-manager = "app.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
