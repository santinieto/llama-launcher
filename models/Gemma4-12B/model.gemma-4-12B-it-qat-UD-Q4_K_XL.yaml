name: Gemma 4 12B
description: Google Gemma 4 12B

backend:
  type: llama.cpp

model:
  file: gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
  format: gguf
  draft_model: mtp-gemma-4-12B-it.gguf

server:
  host: 127.0.0.1
  port: 18765
  alias: Gemma4-12B

hardware:
  gpu_layers: all
  context_size: 32768   # Q4: 358 MiB libre, max contexto seguro
  batch_size: 1024
  flash_attention: true
  tensor_split: "1"

cache:
  type_k: q4_0
  type_v: q4_0
  type_k_draft: q4_0
  type_v_draft: q4_0

speculative:
  enabled: true
  spec_type: draft-mtp
  draft_n_max: 4

sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0

capabilities:
  vision: false

advanced:
  reasoning: true
  parallel: 1
  log_verbosity: 4
  draft_gpu_layers: 0
  cache_ram: 4096
