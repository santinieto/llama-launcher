name: Gemma 4 E4B
description: Google Gemma 4 E4B

backend:
  type: llama.cpp

model:
  file: gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
  format: gguf
  draft_model: mtp-gemma-4-E4B-it.gguf

server:
  host: 127.0.0.1
  port: 18765
  alias: Gemma4-E4B

hardware:
  gpu_layers: all
  context_size: 65536
  batch_size: 4096
  flash_attention: false

cache:
  type_k: q8_0
  type_v: f16
  type_k_draft: q8_0
  type_v_draft: f16

speculative:
  enabled: true
  spec_type: draft-mtp
  draft_n_max: 2

sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0

capabilities:
  vision: true

vision:
  encoder: mmproj-F16.gguf
  image_min_tokens: 0

advanced:
  reasoning: true
  parallel: 1
  log_verbosity: 4
  cache_ram: 8192

